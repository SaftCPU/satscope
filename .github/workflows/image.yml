name: Image

# Baut das Container-Image so, wie es jede andere Umbrel-App auch tut:
# ein fertiges MULTI-ARCH-Image in einer oeffentlichen Registry, das Umbrel
# beim Installieren nur noch zieht.
#
#   linux/amd64  fuer Umbrel auf dem PC
#   linux/arm64  fuer Umbrel auf dem Raspberry Pi
#
# Warum hier und nicht daheim: Der PC hat kein Docker, und der buildx-Treiber
# auf .67 ist im Fehlerzustand ohne QEMU - dort laesst sich arm64 gar nicht
# uebersetzen. GitHubs Laeufer bringen QEMU mit. Ausserdem braucht es so KEIN
# Token: GITHUB_TOKEN wird je Lauf erzeugt und laeuft danach ab.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  # ghcr verlangt Kleinschreibung - deshalb fest, nicht aus github.repository_owner.
  IMAGE: ghcr.io/saftcpu/satscope

jobs:
  selbsttest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Laeuft ohne Netz und ohne Abhaengigkeiten. Prueft die Stellen, an denen
      # Zweisprachigkeit bricht, und dass das Web-Tor teure RPC-Methoden nicht kennt.
      - run: cd src && python -m satscope.selbsttest

  bauen:
    needs: selbsttest
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU: uebersetzt arm64 auf einem x86-Laeufer.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: marken
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short

      - id: bauen
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.marken.outputs.tags }}
          labels: ${{ steps.marken.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Umbrel-Apps nageln ihr Image per Digest fest. Der gehoert danach in
      # satscope/docker-compose.yml - WICHTIG: der Digest der MANIFEST-LISTE,
      # nicht der einer einzelnen Architektur, sonst laeuft die App auf dem
      # Raspberry Pi nicht.
      - name: Digest fuer das Compose ausgeben
        run: |
          {
            echo "## Ins docker-compose.yml eintragen"
            echo ""
            echo '```yaml'
            echo "    image: ${{ env.IMAGE }}:latest@${{ steps.bauen.outputs.digest }}"
            echo '```'
            echo ""
            echo "### Architekturen pruefen"
            echo '```'
            docker buildx imagetools inspect "${{ env.IMAGE }}@${{ steps.bauen.outputs.digest }}" \
              | grep -E "Name|Platform" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
