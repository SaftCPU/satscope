<!doctype html>
<html lang="{{ t.sprache }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titel %}{{ t.t("app.name") }}{% endblock %}</title>
<script>
/* Setzt das gespeicherte Thema, BEVOR der Browser das erste Mal zeichnet.
   Muss vor den Stylesheets stehen: ein Skript danach wartet auf deren Laden,
   und diese Wartezeit ist genau das Aufblitzen des falschen Themas.
   classList.add("js") steht absichtlich AUSSERHALB des try - im privaten
   Modus wirft localStorage, und ohne die Klasse bliebe die Kopfleiste halb
   unsichtbar. "System" heisst: gar kein data-theme, dann greift die
   Medienabfrage in satscope.css. */
(function(){try{var w=localStorage.getItem("satscope-thema");
if(w==="light"||w==="dark")document.documentElement.setAttribute("data-theme",w);}catch(e){}
document.documentElement.classList.add("js");})();
</script>
<link rel="icon" type="image/svg+xml" href="/statisch/icon.svg">
<link rel="stylesheet" href="/statisch/satscope.css">
<link rel="stylesheet" href="/statisch/tiefenkarte.css">
<link rel="stylesheet" href="/statisch/feinschliff.css">
</head>
<body>
  {% include "teile/kopfleiste.html" %}

  <main class="inhalt">
    {% block inhalt %}{% endblock %}
  </main>

  <footer class="fuss">{{ t.t("footer.nocalls") }}</footer>
  <script src="/statisch/satscope.js" defer></script>
  <script src="/statisch/feinschliff.js" defer></script>
</body>
</html>
