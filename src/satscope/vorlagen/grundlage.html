<!doctype html>
<html lang="{{ t.sprache }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{% block titel %}{{ t.t("app.name") }}{% endblock %}</title>
<link rel="icon" type="image/svg+xml" href="/statisch/icon.svg">
<link rel="stylesheet" href="/statisch/satscope.css">
<link rel="stylesheet" href="/statisch/tiefenkarte.css">
</head>
<body>
  <header class="kopf">
    <a class="marke" href="/">
      <span class="marke-punkt"></span>
      <span class="marke-name">{{ t.t("app.name") }}</span>
    </a>
    <nav class="nav">
      <!-- /node kommt in Stufe A. Kein Menuepunkt ohne Ziel:
           ein toter Link ist der erste Klick eines jeden Pruefers. -->
      <!-- Sprachwahl: einfacher Link, damit sie auch ohne JavaScript geht.
           Der Server setzt das Cookie und leitet zurueck. -->
      <a class="sprachwahl"
         href="/sprache/{{ "de" if t.sprache == "en" else "en" }}?weiter={{ pfad }}"
         rel="nofollow">{{ t.t("lang.switch") }}</a>
    </nav>
  </header>

  <main class="inhalt">
    {% block inhalt %}{% endblock %}
  </main>

  <footer class="fuss">{{ t.t("footer.nocalls") }}</footer>
  <script src="/statisch/satscope.js" defer></script>
</body>
</html>
