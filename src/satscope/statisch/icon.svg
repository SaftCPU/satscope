<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img"
     aria-label="Satscope">
  <!--
    Satscope-Zeichen. Vollstaendig selbst gezeichnet, nur Grundformen -
    keine fremde Emoji-Grafik, damit keine Lizenzfrage entstehen kann.

    Bildidee: ein Block, durch eine Linse betrachtet. Die Linse veraendert den
    Block nicht, sie zeigt nur, was ohnehin darin steckt - genau die
    Entwurfsidee der App.

    Bewusst grobe Formen: das Zeichen muss noch bei 32 px lesbar sein.
  -->
  <defs>
    <linearGradient id="grund" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#241738"/>
      <stop offset="1" stop-color="#16101f"/>
    </linearGradient>
    <linearGradient id="glas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c4a2ff"/>
      <stop offset="1" stop-color="#a371f7"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#grund)"/>

  <!-- Der Block: bewusst schlicht, leicht gedreht, damit er unter der Linse
       nicht wie ein Knopf wirkt. -->
  <g transform="rotate(-12 252 244)">
    <!-- Kontrast bewusst hoch: bei 32 px verschwand die alte, dunklere Fassung
         zu einem Fleck. Weniger Balken, dafuer dicker - Detail, das man nicht
         mehr trennen kann, schadet nur. -->
    <rect x="172" y="164" width="164" height="164" rx="30"
          fill="none" stroke="#8f6ddb" stroke-width="26"/>
    <g fill="#8f6ddb">
      <rect x="208" y="212" width="92" height="26" rx="13"/>
      <rect x="208" y="256" width="58" height="26" rx="13"/>
    </g>
  </g>

  <!-- Die Linse. Der Ring liegt ueber dem Block und schneidet ihn an -
       dadurch wirkt sie davor statt daneben. -->
  <circle cx="238" cy="238" r="118" fill="none"
          stroke="url(#glas)" stroke-width="30"/>
  <!-- Lichtreflex: ein kurzer Bogen oben links, mehr braucht es nicht. -->
  <path d="M 168 196 A 90 90 0 0 1 214 158" fill="none"
        stroke="#efe4ff" stroke-width="16" stroke-linecap="round"
        opacity=".85"/>

  <!-- Griff -->
  <path d="M 322 322 L 404 404" stroke="url(#glas)" stroke-width="46"
        stroke-linecap="round"/>
</svg>
