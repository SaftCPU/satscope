version: "3.7"

services:
  app_proxy:
    environment:
      # Muss exakt <app-id>_<dienstname>_1 lauten.
      APP_HOST: satscope_sat-web_1
      APP_PORT: 8000
      # PROXY_AUTH_ADD wird BEWUSST nicht gesetzt: dann schuetzt Umbrels eigener
      # Login jede Route inklusive WebSocket. Satscope hat keine eigene
      # Benutzerverwaltung und braucht deshalb auch keine Ausnahme.

  # Dienstnamen mit Praefix, weil alle Apps im selben Docker-Netz haengen und
  # ein Dienst namens "web" dort bereits existiert (Mempool).
  sat-web:
    image: ghcr.io/saftcpu/satscope:0.1.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    command: ["python", "-m", "satscope.web"]
    # OHNE Speicherdeckel trifft der OOM-Killer den groessten Prozess - das waere
    # bitcoind. Auf Umbrel gibt es nur zram als Swap, also keinen Ausweg auf
    # Platte. memswap_limit == mem_limit verhindert, dass wir zram vollschreiben.
    mem_limit: 700m
    memswap_limit: 700m
    cpus: 1.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SATSCOPE_ROLLE: web
      SATSCOPE_DB: /data/satscope.sqlite
      SATSCOPE_PORT: "8000"
      BITCOIN_RPC_HOST: $APP_BITCOIN_NODE_IP
      BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT

  sat-sammler:
    image: ghcr.io/saftcpu/satscope:0.1.0
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 1m
    command: ["python", "-m", "satscope.sammler"]
    mem_limit: 800m
    memswap_limit: 800m
    cpus: 2.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
      # VERZEICHNIS binden, nicht die Datei: zeigt ein Datei-Bind auf eine noch
      # nicht existierende Quelle, legt Docker dort ein VERZEICHNIS an und der
      # Start bricht. Das Datenverzeichnis existiert dagegen immer.
      - ${UMBREL_ROOT}/app-data/bitcoin/data/bitcoin:/bitcoin:ro
    environment:
      SATSCOPE_ROLLE: sammler
      SATSCOPE_DB: /data/satscope.sqlite
      SATSCOPE_DEBUG_LOG: /bitcoin/debug.log
      BITCOIN_RPC_HOST: $APP_BITCOIN_NODE_IP
      BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS
      ZMQ_HOST: $APP_BITCOIN_NODE_IP
      ZMQ_HASHBLOCK_PORT: $APP_BITCOIN_ZMQ_HASHBLOCK_PORT
      ZMQ_RAWTX_PORT: $APP_BITCOIN_ZMQ_RAWTX_PORT
      ZMQ_SEQUENCE_PORT: $APP_BITCOIN_ZMQ_SEQUENCE_PORT
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
