version: "3.7"

services:
  app_proxy:
    environment:
      # Muss exakt <app-id>_<dienstname>_1 lauten.
      APP_HOST: satscope_sat-web_1
      APP_PORT: 8000
      # PROXY_AUTH_ADD wird BEWUSST nicht gesetzt: dann schuetzt Umbrels eigener
      # Login jede Route inklusive WebSocket. Satscope hat keine eigene
      # Benutzerverwaltung und braucht deshalb auch keine Ausnahme.

  # Dienstnamen mit Praefix, weil alle Apps im selben Docker-Netz haengen und
  # ein Dienst namens "web" dort bereits existiert (Mempool).
  sat-web:
    image: ghcr.io/saftcpu/satscope:0.1.0@sha256:f32920f00dafa283bf3efb46d644ef48f5e3277b29cd8a513a2db0038886cdea
    user: "1000:1000"
    init: true
    restart: on-failure
    stop_grace_period: 30s
    command: ["python", "-m", "satscope.web"]
    # OHNE Speicherdeckel trifft der OOM-Killer den groessten Prozess - das waere
    # bitcoind. Auf Umbrel gibt es nur zram als Swap, also keinen Ausweg auf
    # Platte. memswap_limit == mem_limit verhindert, dass wir zram vollschreiben.
    mem_limit: 700m
    memswap_limit: 700m
    cpus: 1.0
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      SATSCOPE_ROLLE: web
      SATSCOPE_DB: /data/satscope.sqlite
      SATSCOPE_PORT: "8000"
      BITCOIN_RPC_HOST: $APP_BITCOIN_NODE_IP
      BITCOIN_RPC_PORT: $APP_BITCOIN_RPC_PORT
      BITCOIN_RPC_USER: $APP_BITCOIN_RPC_USER
      BITCOIN_RPC_PASS: $APP_BITCOIN_RPC_PASS

# Der Sammler-Dienst folgt, sobald er wirklich arbeitet. Ein Dienst, dessen
# Prozess sofort zurueckkehrt, stuende dauerhaft als "Exited (0)" in der
# Oberflaeche - Umbrel verlangt einen Dienst je LANGLAUFENDEM Prozess.
#
# Ebenso folgt spaeter der Lesezugriff auf bitcoinds debug.log. Der laeuft dann
# ueber ${APP_BITCOIN_DATA_DIR} aus bitcoins eigenem exports.sh, NICHT ueber
# einen hartkodierten Pfad in fremde App-Daten - der braeche, sobald jemand
# testnet faehrt.
