manifestVersion: 1
id: satscope
category: bitcoin
name: Satscope
version: "0.2.0"
tagline: Every number in context
description: >-
  Requires a Bitcoin node and an Electrum server (electrs or Fulcrum) on
  your Umbrel. Satscope reads from both and sends nothing anywhere else.


  Stage A: Satscope currently shows the state of your own node - chain tip,
  block age, mempool size and peers. Blocks, transactions and addresses are
  not built yet.


  Where it is going: an explorer that looks as plain as the one you already
  know, but where every number comes with the context that makes it mean
  something. Not "1.00 sat/vB", but "1.00 sat/vB - the lowest in three days".


  The front page answers a single question: how is the network doing right
  now? Everything else will live on the object it belongs to, one click away.


  Nothing is invented. When a source is unavailable, Satscope shows a dash
  instead of a guess. And nothing leaves your node: there are no outbound
  calls to the internet.
releaseNotes: ""
developer: SaftCPU
website: https://saftcpu.com/satscope
# Beide sind Pflicht (Daniels Entscheidung 15.08.2026).
# "electrs" ist die Abhaengigkeits-Kennung fuer JEDEN Electrum-Server: Fulcrum
# meldet im eigenen Manifest `implements: electrs` und erfuellt sie damit
# ebenso. Der Nutzer kann also frei waehlen.
dependencies:
  - bitcoin
  - electrs
